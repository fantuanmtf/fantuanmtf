  <text x="14" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.2">We accept</text>
  <text x="13" y="45" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.1">Bitcoin</text>

  <circle cx="172" cy="28" r="22" fill="url(#coin)" stroke="#ffe9a8" stroke-width="2"/>
  <circle cx="172" cy="28" r="16.5" fill="#f7b91f" opacity="0.55"/>
  <path d="M168 12.5V43.5M176 12.5V43.5" stroke="#7a4b00" stroke-width="2.2" stroke-linecap="round"/>
  <text x="172" y="38" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="27" font-weight="900" fill="#7a4b00">B</text>
