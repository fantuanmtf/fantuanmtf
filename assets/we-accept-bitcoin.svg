<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" width="200" height="56" role="img" aria-labelledby="title">
  <title id="title">We accept Bitcoin</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8bf0"/>
      <stop offset="1" stop-color="#0b45b5"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="0.45" stop-color="#f6c445"/>
      <stop offset="1" stop-color="#d99412"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="200" height="56" rx="11"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="200" height="56" fill="url(#bg)"/>
    <g fill="#9cc7ff" opacity="0.22">
      <rect x="0" y="0" width="12" height="12"/>
      <rect x="12" y="0" width="6" height="6"/>
      <rect x="0" y="26" width="8" height="8"/>
      <rect x="36" y="0" width="7" height="14"/>
      <rect x="58" y="6" width="8" height="8"/>
      <rect x="118" y="0" width="10" height="10"/>
      <rect x="128" y="10" width="6" height="6"/>
      <rect x="0" y="44" width="14" height="12"/>
      <rect x="22" y="38" width="7" height="7"/>
      <rect x="136" y="46" width="9" height="10"/>
      <rect x="188" y="0" width="12" height="12"/>
      <rect x="176" y="44" width="12" height="12"/>
    </g>
    <g fill="#062f86" opacity="0.18">
      <rect x="12" y="12" width="10" height="10"/>
